version: '3.8'

services:
  epr_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epr_dashboard_app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FTP_VIXHOST_HOST=${FTP_VIXHOST_HOST:-ftp.consuldatasistemas.com.br}
      - FTP_VIXHOST_PORT=${FTP_VIXHOST_PORT:-21}
      - FTP_VIXHOST_USER=${FTP_VIXHOST_USER:-consuldata}
      - FTP_VIXHOST_PASSWORD=${FTP_VIXHOST_PASSWORD:-}
      - FTP_UOLHOST_HOST=${FTP_UOLHOST_HOST:-ftp.sistemaplenus.com.br}
      - FTP_UOLHOST_PORT=${FTP_UOLHOST_PORT:-21}
      - FTP_UOLHOST_USER=${FTP_UOLHOST_USER:-sistemaplenus}
      - FTP_UOLHOST_PASSWORD=${FTP_UOLHOST_PASSWORD:-}
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/app/server/data
      - ./downloads:/app/server/downloads
